<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoPro 360 Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #2a2a2a;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid #3a3a3a;
        }

        h1 {
            flex: none;
            font-size: 1.15rem;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-left: auto;
            flex: none;
        }

        .header-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-icon svg {
            width: 20px;
            height: 20px;
        }

        .header-icon.is-exporting {
            background: #4a9eff;
        }

        .export-menu {
            position: relative;
        }

        .export-popover {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            z-index: 15;
            width: 280px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 0.9rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .export-popover[hidden] {
            display: none;
        }

        .export-popover label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: #bbb;
        }

        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #viewer-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        #viewer {
            width: 100%;
            height: 100%;
            display: block;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background: #4a9eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #3a8eef;
        }

        .btn:disabled {
            background: #3a3a3a;
            color: #666;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #3a3a3a;
        }

        .btn-secondary:hover {
            background: #4a4a4a;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #4a9eff;
        }

        #file-info {
            flex: 1;
            min-width: 0;
            font-size: 0.85rem;
            color: #bbb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #file-info[hidden] {
            display: none;
        }

        #timeline-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(42, 42, 42, 0.95);
            padding: 1rem;
            border-top: 1px solid #3a3a3a;
            display: none;
        }

        #timeline {
            position: relative;
            height: 56px;
            background: #1a1a1a;
            border-radius: 4px;
            margin-bottom: 1rem;
            cursor: pointer;
        }

        .timeline-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #4a9eff;
            cursor: ew-resize;
        }

        #start-marker {
            left: 0;
            background: #4ade80;
        }

        #end-marker {
            right: 0;
            background: #ef4444;
        }

        #start-marker,
        #end-marker {
            z-index: 3;
        }

        #playhead {
            left: 0;
            z-index: 2;
            width: 12px;
            margin-left: -6px;
            background: transparent;
        }

        #playhead::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 5px;
            width: 2px;
            background: #fff;
        }

        .timeline-selection {
            position: absolute;
            top: 0;
            bottom: 0;
            background: rgba(74, 158, 255, 0.2);
            border-left: 2px solid #4ade80;
            border-right: 2px solid #ef4444;
            pointer-events: none;
        }

        #playback-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        #trim-info {
            display: flex;
            gap: 1.25rem;
            margin-top: 0.6rem;
            font-size: 0.85rem;
        }

        #trim-info .trim-label {
            color: #888;
            margin-right: 0.35rem;
        }

        #trim-info .trim-start-label {
            color: #4ade80;
        }

        #trim-info .trim-end-label {
            color: #ef4444;
        }

        #play-pause {
            width: 60px;
            padding: 0.5rem;
        }

        #current-time {
            font-size: 0.9rem;
            color: #888;
        }

        .progress {
            background: #1a1a1a;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1rem;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #3a3a3a;
            border-radius: 4px;
            overflow: hidden;
            margin: 0.5rem 0;
        }

        .progress-fill {
            height: 100%;
            background: #4a9eff;
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 0.85rem;
            color: #888;
        }

        select {
            width: 100%;
            padding: 0.75rem;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        #placeholder {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #666;
            cursor: pointer;
        }

        #placeholder:hover {
            color: #aaa;
        }

        #placeholder svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        #placeholder.is-busy {
            cursor: default;
            color: #ccc;
        }

        #placeholder.is-busy:hover {
            color: #ccc;
        }

        #placeholder.is-busy svg,
        #placeholder.is-busy #placeholder-prompt {
            display: none;
        }

        #placeholder-progress {
            display: none;
            width: 280px;
            max-width: 80%;
            text-align: center;
        }

        #placeholder.is-busy #placeholder-progress {
            display: block;
        }

        #placeholder-progress .progress-text {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 0.75rem;
        }

        #placeholder-progress .progress-bar {
            margin: 0;
        }

        #timeline-container {
            z-index: 2;
        }

        #view-controls {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.7rem 0.85rem;
            background: rgba(42, 42, 42, 0.94);
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            user-select: none;
        }

        #view-controls[hidden] {
            display: none;
        }

        .view-knob {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            width: 72px;
        }

        .knob {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1px solid #4a4a4a;
            background:
                radial-gradient(circle at 50% 50%, transparent 60%, rgba(74, 158, 255, 0.18) 61%, rgba(74, 158, 255, 0.18) 68%, transparent 69%),
                radial-gradient(circle at 32% 28%, #555, #1a1a1a 72%);
            box-shadow: inset 0 0 0 1px #111, 0 2px 6px rgba(0, 0, 0, 0.45);
            cursor: ns-resize;
            position: relative;
            touch-action: none;
            padding: 0;
        }

        .knob:focus-visible {
            outline: 2px solid #4a9eff;
            outline-offset: 2px;
        }

        .knob-face {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            transform: rotate(var(--angle, 0deg));
        }

        .knob-mark {
            position: absolute;
            left: 50%;
            top: 7px;
            width: 3px;
            height: 12px;
            margin-left: -1.5px;
            background: #4a9eff;
            border-radius: 2px;
            box-shadow: 0 0 6px rgba(74, 158, 255, 0.75);
        }

        .knob-label {
            font-size: 0.7rem;
            color: #888;
        }

        .knob-value {
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
            color: #fff;
            min-width: 3.2rem;
            text-align: center;
        }

        #view-reset {
            width: auto;
            padding: 0.45rem 0.75rem;
            font-size: 0.8rem;
        }

        .browser-path {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .browser-path input[type="text"] {
            flex: 1;
            width: auto;
            margin-bottom: 0;
        }

        .browser-path .btn {
            width: auto;
            flex: none;
        }

        .modal:not([hidden]) {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
        }

        .modal-card {
            position: relative;
            width: min(720px, calc(100vw - 2rem));
            height: min(640px, calc(100vh - 2rem));
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 1.25rem;
            gap: 0.75rem;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .modal-header h2 {
            font-size: 1.05rem;
            color: #fff;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 4px;
            background: #3a3a3a;
            color: #fff;
            cursor: pointer;
            font-size: 1.25rem;
            line-height: 1;
        }

        .icon-btn:hover {
            background: #4a4a4a;
        }

        .places {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .place-btn,
        .browser-item {
            background: #1a1a1a;
            color: #ddd;
            border: 1px solid #3a3a3a;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .place-btn {
            border-radius: 999px;
            padding: 0.35rem 0.7rem;
        }

        .place-btn:hover,
        .place-btn.active {
            border-color: #4a9eff;
            color: #fff;
        }

        .browser-item:hover {
            background: #333;
            color: #fff;
        }

        .browser-nav {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .browser-nav .btn {
            width: auto;
            padding: 0.5rem 0.75rem;
        }

        #browser-current {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.85rem;
            color: #bbb;
        }

        .browser-list {
            flex: 1;
            overflow: auto;
            background: #1a1a1a;
            border-radius: 4px;
            padding: 0.25rem;
        }

        .browser-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            width: 100%;
            text-align: left;
            border: none;
            border-radius: 4px;
            padding: 0.6rem 0.75rem;
        }

        .browser-item.file {
            color: #8ec2ff;
        }

        .browser-kind {
            width: 2.4rem;
            flex: none;
            color: #888;
            font-size: 0.75rem;
        }

        .browser-empty,
        .browser-status {
            padding: 1rem 0.75rem;
            color: #888;
            font-size: 0.85rem;
        }

        .browser-status.error {
            color: #ef4444;
        }

        .modal-hint {
            color: #888;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div id="container">
        <header>
            <h1>🎥 GoPro 360 Editor</h1>
            <div id="file-info" hidden></div>
            <div class="header-actions">
                <button id="open-btn" class="icon-btn header-icon" type="button" aria-label="Open file" title="Open file">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" />
                    </svg>
                </button>
                <div class="export-menu">
                    <button id="export-menu-btn" class="icon-btn header-icon" type="button" aria-label="Export" title="Export" aria-expanded="false" aria-controls="export-popover">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3" />
                        </svg>
                    </button>
                    <div id="export-popover" class="export-popover" hidden>
                        <label for="quality">Quality</label>
                        <select id="quality">
                            <option value="high">High (CRF 18, slow)</option>
                            <option value="medium" selected>Medium (CRF 23, normal)</option>
                            <option value="low">Low (CRF 28, fast)</option>
                        </select>
                        <label for="output-name">File name</label>
                        <input type="text" id="output-name" placeholder="my_360_video">
                        <button id="export-btn" class="btn" type="button" disabled>Export MP4</button>
                        <div id="export-progress" class="progress"></div>
                    </div>
                </div>
            </div>
        </header>

        <div id="main">
            <div id="viewer-container">
                <canvas id="viewer"></canvas>
                <div id="view-controls" hidden>
                    <div class="view-knob" data-axis="yaw">
                        <button type="button" class="knob" aria-label="Horizontal" role="slider" aria-valuemin="-180" aria-valuemax="180" aria-valuenow="0">
                            <span class="knob-face"><span class="knob-mark"></span></span>
                        </button>
                        <span class="knob-label">Horizontal</span>
                        <span class="knob-value">0°</span>
                    </div>
                    <div class="view-knob" data-axis="pitch">
                        <button type="button" class="knob" aria-label="Vertical" role="slider" aria-valuemin="-90" aria-valuemax="90" aria-valuenow="0">
                            <span class="knob-face"><span class="knob-mark"></span></span>
                        </button>
                        <span class="knob-label">Vertical</span>
                        <span class="knob-value">0°</span>
                    </div>
                    <div class="view-knob" data-axis="roll">
                        <button type="button" class="knob" aria-label="Roll" role="slider" aria-valuemin="-180" aria-valuemax="180" aria-valuenow="0">
                            <span class="knob-face"><span class="knob-mark"></span></span>
                        </button>
                        <span class="knob-label">Roll</span>
                        <span class="knob-value">0°</span>
                    </div>
                    <button id="view-reset" class="btn btn-secondary" type="button">Reset</button>
                </div>

                <div id="placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    <p id="placeholder-prompt">Click to choose a .360 file</p>
                    <div id="placeholder-progress">
                        <div class="progress-text">Generating preview...</div>
                        <div class="progress-bar"><div class="progress-fill" style="width: 0%"></div></div>
                    </div>
                </div>

                <div id="timeline-container">
                    <div id="timeline">
                        <div class="timeline-selection"></div>
                        <div id="playhead" class="timeline-marker"></div>
                        <div id="start-marker" class="timeline-marker"></div>
                        <div id="end-marker" class="timeline-marker"></div>
                    </div>
                    <div id="playback-controls">
                        <button id="play-pause" class="btn btn-secondary">▶</button>
                        <span id="current-time">0:00 / 0:00</span>
                    </div>
                    <div id="trim-info">
                        <span><span class="trim-label trim-start-label">Start</span><span id="trim-start">0:00</span></span>
                        <span><span class="trim-label trim-end-label">End</span><span id="trim-end">0:00</span></span>
                        <span><span class="trim-label">Duration</span><span id="trim-duration">0:00</span></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="file-browser" class="modal" hidden>
        <div class="modal-backdrop" id="browser-backdrop"></div>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="browser-title">
            <div class="modal-header">
                <h2 id="browser-title">Select a .360 file</h2>
                <button id="browser-close" class="icon-btn" type="button" aria-label="Close">×</button>
            </div>
            <div class="places" id="browser-places"></div>
            <div class="browser-nav">
                <button id="browser-up" class="btn btn-secondary" type="button">Up</button>
                <span id="browser-current"></span>
            </div>
            <div id="browser-list" class="browser-list"></div>
            <p class="modal-hint">Click a folder to open it. Click a .360 file to load it, or paste a full path.</p>
            <div class="browser-path">
                <input type="text" id="file-path" placeholder="C:\Videos\GS010001.360">
                <button id="load-btn" class="btn" type="button">Load file</button>
            </div>
            <button id="system-dialog-btn" class="btn btn-secondary" type="button">Use system file dialog</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="/app.js"></script>
</body>
</html>
